# This is ONE valid solution. Your skill may differ and still be effective.
# Add this entry to _marts_schema.yml under the models: list

  - name: mart_customer_orders
    description: Customer-level order summary with total orders, revenue, and order date range. Excludes returned orders.
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - not_null
          - unique
      - name: total_orders
        description: Total number of orders placed by this customer
        tests:
          - not_null
      - name: total_revenue
        description: Total revenue in dollars from this customer
        tests:
          - not_null
      - name: first_order_date
        description: Date of the customer's first order
        tests:
          - not_null
      - name: last_order_date
        description: Date of the customer's most recent order
        tests:
          - not_null
