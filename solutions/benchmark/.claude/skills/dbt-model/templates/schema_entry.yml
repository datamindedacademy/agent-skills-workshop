# Schema entry template for mart models
# Add this to _marts_schema.yml under the models: list

  - name: <model_name>
    description: <One-line description of what this mart provides>
    columns:
      - name: <primary_key_column>
        description: <Column description>
        tests:
          - not_null
          - unique
      - name: <metric_column>
        description: <Column description>
        tests:
          - not_null
      - name: <revenue_column>
        description: <Column description — note "in dollars" for monetary>
        tests:
          - not_null
      - name: <date_column>
        description: <Column description>
        tests:
          - not_null
