version: 2

# Governance is deliberately incomplete here: several columns have no
# description and key columns are missing tests. Stage 1 (data-product-checkup)
# measures the gaps; Stage 2 (remediate-products) fills them in.
# Do not "fix" this file by hand: it's the starting point for the exercise.
models:
  - name: dim_customers
    description: >
      Customer dimension data product. One row per customer.
      Owner: Customer Data team. Refresh: daily.
    columns:
      - name: customer_id
        description: Unique customer identifier (primary key).
        data_tests:
          - unique
          - not_null
      - name: email
      - name: country

  - name: fct_orders
    description: >
      Order fact data product, enriched with customer attributes.
      Grain: one row per order. Owner: Commerce team. Refresh: hourly.
      Source table for the workshop warm-up (exported to sample.csv).
    columns:
      - name: order_id
        description: Order identifier.
        data_tests:
          # Strict in production: the deliberate duplicate order_id fails the
          # scheduled Airflow run (debugging exercise); local builds only warn.
          - unique:
              config:
                severity: "{{ 'error' if target.name == 'prod' else 'warn' }}"
          - not_null
      - name: customer_id
        description: Foreign key to dim_customers.
        data_tests:
          # Strict in production: the orphan customer_id (999) fails the
          # scheduled Airflow run (debugging exercise); local builds only warn.
          - relationships:
              to: ref('dim_customers')
              field: customer_id
              config:
                severity: "{{ 'error' if target.name == 'prod' else 'warn' }}"
      - name: amount
      - name: status

  - name: customer_order_summary
    description: >
      Per-customer order summary data product. Grain: one row per customer.
      Owner: Analytics team. Refresh: daily.
    columns:
      - name: customer_id
        data_tests:
          - unique
      - name: country
      - name: order_count
      - name: total_amount
      - name: last_order_date
